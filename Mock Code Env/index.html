<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kameleoon Mock Code Env</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3838E7',
            'primary-hover': '#2b2bb5',
            background: '#FAFAFA',
            surface: '#FFFFFF',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Monaco', 'Consolas', 'monospace'],
          },
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background: #1e1e1e;
      color: #d4d4d4;
    }

    .editor-line {
      counter-increment: line;
    }

    .editor-line::before {
      content: counter(line);
      display: inline-block;
      width: 2rem;
      margin-right: 1rem;
      text-align: right;
      color: #858585;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Bridge Client
    const callMcpTool = async (name, args = {}) => {
      try {
        // Try connecting to local server
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1000); // 1s timeout

        const response = await fetch('http://localhost:3001/mcp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: 'tools/call',
            params: { name, arguments: args }
          }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const data = await response.json();
        return data.result.content[0].text;
      } catch (err) {
        console.warn('MCP connection failed, using mock fallback:', err);

        // Lot 0 (MVP) Fallback
        if (name === 'kameleoon_predictive_templates') {
          const suggestions = [
            {
              "name": "list_feature_flags",
              "confidence": "MVP",
              "description": "List all available feature flags for the current project.",
              "code": "list_feature_flags"
            },
            {
              "name": "get_feature_flag",
              "confidence": "MVP",
              "description": "Retrieve configuration for a specific flag.",
              "code": "get_feature_flag"
            },
            {
              "name": "search_flags",
              "confidence": "MVP",
              "description": "Search flags by name or key.",
              "code": "search_flags"
            },
            {
              "name": "view_activity_logs",
              "confidence": "MVP",
              "description": "View audit logs for a flag.",
              "code": "view_activity_logs"
            },
            {
              "name": "request_results",
              "confidence": "MVP",
              "description": "Get performance metrics for a flag.",
              "code": "request_results"
            }
          ];
          return JSON.stringify(suggestions);
        }

        if (name === 'kameleoon_generate_sdk_snippet') {
          const key = args.key || 'generic';

          if (key === 'list_feature_flags') {
            return `// List all feature flags
const flags = await kameleoon.getFeatureFlags();
console.table(flags);`;
          }
          if (key === 'get_feature_flag') {
            return `// Get details for a specific flag
const flagKey = "cart_abandonment_promo";
const config = await kameleoon.getFeatureFlag(flagKey);
console.log("Flag Config:", config);`;
          }
          if (key === 'search_flags') {
            return `// Search for flags
const query = "header";
const results = await kameleoon.searchFlags(query);
console.log(\`Found \${results.length} flags matching "\${query}"\`);`;
          }
          if (key === 'view_activity_logs') {
            return `// View activity logs for a flag
const logs = await kameleoon.getFlagActivity("new_checkout_flow");
logs.forEach(log => {
  console.log(\`[\${log.timestamp}] \${log.user}: \${log.action}\`);
});`;
          }
          if (key === 'request_results') {
            return `// Request results for a feature flag experiment
const results = await kameleoon.getExperimentResults("pricing_page_v2");
console.log("Conversion Rate:", results.conversionRate);
console.log("Confidence:", results.statisticalSignificance);`;
          }

          return `// Generic Kameleoon SDK Snippet
const client = new KameleoonClient({ siteCode: "SITE_CODE" });
await client.initialize();`;
        }
      }
    };

    function App() {
      const [code, setCode] = useState("// Welcome to the Kameleoon Mock Code Environment\n// Type '//' to see AI suggestions from the MCP Server\n// (Works with local MCP server or falls back to demo mode)\n\n");
      const [suggestions, setSuggestions] = useState([]);
      const [loading, setLoading] = useState(false);
      const [logs, setLogs] = useState([]);
      const textareaRef = useRef(null);

      const addLog = (msg) => setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev]);

      const handleKeyDown = async (e) => {
        if (e.key === 'Enter' && code.trim().endsWith('//')) {
          // Trigger suggestion
          e.preventDefault();
          setLoading(true);
          addLog('Asking MCP for suggestions...');

          try {
            // Mocking context: Assume we are asking for templates
            const response = await callMcpTool('kameleoon_predictive_templates', { vertical: 'e-commerce' });

            // Handle parsing (supports both plain JSON and text-prefixed JSON)
            const parts = response.split('\n');
            let jsonPart = parts.find(p => p.trim().startsWith('['));
            if (!jsonPart && parts.length === 1 && response.trim().startsWith('[')) {
              jsonPart = response;
            }
            if (!jsonPart && parts.length > 1) jsonPart = parts[1];

            if (jsonPart) {
              setSuggestions(JSON.parse(jsonPart));
              addLog('Received suggestions from MCP');
            } else {
              addLog('Failed to parse suggestions');
            }
          } catch (err) {
            addLog('Failed to get suggestions');
            console.error(err);
          } finally {
            setLoading(false);
          }
        }
      };

      const insertTemplate = async (template) => {
        setLoading(true);
        addLog(`Generating SDK snippet for: ${template.name}`);
        const snippet = await callMcpTool('kameleoon_generate_sdk_snippet', {
          key: template.code || template.name.toLowerCase().replace(/\s+/g, '-'),
          language: 'js'
        });

        setCode(prev => prev + `\n// Goal: ${template.description}\n` + snippet + '\n');
        setSuggestions([]);
        setLoading(false);
      };

      return (
        <div className="flex h-screen overflow-hidden text-sm">
          {/* Sidebar */}
          <div className="w-64 bg-[#252526] border-r border-[#333] flex flex-col">
            <div className="p-4 border-b border-[#333]">
              <h1 className="font-semibold text-white">Kameleoon MCP</h1>
              <div className="text-xs text-green-400 mt-1 flex items-center gap-1">
                <span className="w-2 h-2 rounded-full bg-green-400"></span>
                Connected to localhost:3001
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              <div className="text-xs font-mono text-gray-400 uppercase">Available Tools</div>
              <div className="space-y-2">
                {['list_feature_flags', 'list_experiments', 'create_experiment'].map(t => (
                  <div key={t} className="flex items-center gap-2 text-gray-300 hover:text-white cursor-pointer group">
                    <div className="w-5 h-5 rounded bg-[#37373d] flex items-center justify-center text-[10px] group-hover:bg-primary">𝑓</div>
                    <span>{t.replace(/_/g, ' ')}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Logs */}
            <div className="h-48 border-t border-[#333] bg-[#1e1e1e] p-2 overflow-y-auto font-mono text-[10px]">
              {logs.map((l, i) => <div key={i} className="text-gray-500">{l}</div>)}
            </div>
          </div>

          {/* Main Editor */}
          <div className="flex-1 flex flex-col bg-[#1e1e1e]">
            <div className="flex items-center justify-between px-4 py-2 bg-[#2d2d2d] border-b border-[#333]">
              <div className="flex items-center gap-2">
                <span className="text-white font-medium">index.js</span>
              </div>
              <a href="../index.html" className="text-xs text-primary hover:underline">Back to Gallery</a>
            </div>

            <div className="flex-1 relative">
              <textarea
                ref={textareaRef}
                value={code}
                onChange={e => setCode(e.target.value)}
                onKeyDown={handleKeyDown}
                className="w-full h-full bg-[#1e1e1e] text-[#d4d4d4] p-4 font-mono outline-none resize-none leading-relaxed"
                spellCheck="false"
              />

              {/* Suggestion Popover */}
              {suggestions.length > 0 && (
                <div className="absolute top-20 left-10 bg-[#252526] border border-[#454545] shadow-2xl rounded-md w-80 overflow-hidden z-50">
                  <div className="px-3 py-2 bg-[#333] text-xs font-semibold text-white flex justify-between items-center">
                    <span>MCP Suggestions</span>
                    <button onClick={() => setSuggestions([])} className="text-gray-400 hover:text-white">×</button>
                  </div>
                  <div className="py-1">
                    {suggestions.map((s, i) => (
                      <button
                        key={i}
                        onClick={() => insertTemplate(s)}
                        className="w-full text-left px-3 py-2 hover:bg-[#094771] text-xs group"
                      >
                        <div className="font-medium text-white mb-0.5">{s.name} <span className="text-gray-500 group-hover:text-gray-300 ml-1">({s.confidence})</span></div>
                        <div className="text-gray-400 group-hover:text-gray-200 truncate">{s.description}</div>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {loading && (
                <div className="absolute top-4 right-4 text-xs text-primary animate-pulse">
                  Processing...
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
