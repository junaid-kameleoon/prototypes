<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting Screen - Master Prompt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .pbx-sidebar {
            width: 640px;
            background: white;
            border-left: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.05);
            z-index: 50;
        }

        .pbx-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            background: #3838E7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pbx-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FAFAFA;
        }

        .start-panel {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .option-btn {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
        }

        .option-btn:hover {
            background: #f9fafb;
            border-color: #3838E7;
        }

        .main-content {
            flex-grow: 1;
            opacity: 0.1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .version-dropdown select {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 4px 28px 4px 10px;
            font-size: 12px;
            cursor: pointer;
            appearance: none;
            outline: none;
        }

        .version-dropdown-container {
            position: relative;
        }

        .version-dropdown-container::after {
            content: '▾';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            pointer-events: none;
            font-size: 10px;
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="h-10 bg-blue-900 mb-8 rounded"></div>
        <div class="h-64 bg-white shadow rounded p-8"></div>
    </div>

    <aside class="pbx-sidebar">
        <header class="pbx-header">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded bg-white/20 flex items-center justify-center font-bold text-xs text-white">P
                </div>
                <div>
                    <div class="text-sm font-semibold text-white">My 2nd PBX</div>
                    <div class="text-[11px] text-white/70">Starting Screen Mock</div>
                </div>
            </div>
            <div class="version-dropdown-container">
                <select onchange="window.location.href=this.value">
                    <option value="v0/index.html">v0: Original</option>
                    <option value="v1/index.html">v1: Figma</option>
                    <option value="v2/index.html">v2: Fabien</option>
                    <option value="v3/index.html">v3: Merged</option>
                    <option value="v4/index.html">v4: Popup</option>
                    <option value="starting-screen.html" selected>Starting Screen</option>
                    <option value="../index.html">← Gallery</option>
                </select>
            </div>
        </header>

        <div class="pbx-content">
            <div class="start-panel">
                <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h2 class="text-lg font-bold mb-2">What are we optimizing?</h2>
                <p class="text-sm text-gray-500 mb-6">Choose how you'd like to start your experiment</p>

                <button class="option-btn">
                    <svg class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <div class="text-left flex-grow">
                        <div class="font-medium text-sm">Upload image</div>
                        <div class="text-xs text-gray-500">Start from a design file</div>
                    </div>
                </button>

                <button class="option-btn border-2 border-indigo-200 bg-indigo-50"
                    onclick="window.location.href='v2/settings.html?from=starting-screen'">
                    <span class="text-xl">🧠</span>
                    <div class="text-left flex-grow">
                        <div class="font-medium text-sm text-indigo-900">Attach master-prompt</div>
                        <div class="text-xs text-indigo-600">Use your predefined context</div>
                    </div>
                </button>

                <div class="mt-6 text-xs text-gray-500">
                    Our AI can do almost anything except back-end changes. <span
                        class="text-blue-600 underline cursor-pointer">See our guidelines</span>.
                </div>
            </div>
        </div>
    </aside>
</body>

</html>
