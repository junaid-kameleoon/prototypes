<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="1000" rx="40" fill="#1D342F"/>
  
  <!-- Header -->
  <text x="400" y="60" text-anchor="middle" fill="#DAE995" font-family="sans-serif" font-size="28" font-weight="bold" font-style="italic">GUEST MODE V2 USER JOURNEY</text>
  <line x1="300" y1="80" x2="500" y2="80" stroke="#DAE995" stroke-width="2" opacity="0.3"/>

  <!-- Step 1: Landing -->
  <rect x="250" y="120" width="300" height="60" rx="30" fill="#DAE995"/>
  <text x="400" y="155" text-anchor="middle" fill="#1D342F" font-family="sans-serif" font-size="14" font-weight="800">1. USER ENTERS LANDING PAGE</text>
  
  <path d="M400 180V220" stroke="#DAE995" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- Step 2: Input -->
  <rect x="250" y="220" width="300" height="60" rx="30" fill="#DAE995"/>
  <text x="400" y="255" text-anchor="middle" fill="#1D342F" font-family="sans-serif" font-size="14" font-weight="800">2. SUBMIT URL + PROMPT</text>

  <path d="M400 280V320" stroke="#DAE995" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Check -->
  <path d="M400 320L480 360L400 400L320 360Z" fill="#1D342F" stroke="#DAE995" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" fill="#DAE995" font-family="sans-serif" font-size="12" font-weight="bold">EXTENSION FOUND?</text>

  <!-- No Path -->
  <path d="M320 360H160V420" stroke="#DAE995" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="350" fill="#DAE995" font-family="sans-serif" font-size="12" font-weight="bold">NO</text>
  
  <rect x="60" y="420" width="200" height="60" rx="15" fill="#DAE995" opacity="0.8"/>
  <text x="160" y="455" text-anchor="middle" fill="#1D342F" font-family="sans-serif" font-size="12" font-weight="bold">REDIRECT TO CHROME STORE</text>
  
  <!-- Redirection Path -->
  <path d="M160 480V520H400V540" stroke="#DAE995" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="280" y="510" fill="#DAE995" font-family="sans-serif" font-size="10" font-weight="bold">AUTO-REDOCK AFTER INSTALL</text>

  <!-- Yes Path -->
  <path d="M400 400V540" stroke="#DAE995" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="440" fill="#DAE995" font-family="sans-serif" font-size="12" font-weight="bold">YES</text>

  <!-- Step 4: Redirection / Load -->
  <rect x="250" y="540" width="300" height="60" rx="30" fill="#DAE995"/>
  <text x="400" y="575" text-anchor="middle" fill="#1D342F" font-family="sans-serif" font-size="14" font-weight="800">3. LOAD PBX ON TARGET SITE</text>

  <path d="M400 600V640" stroke="#DAE995" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Prompts -->
  <path d="M400 640L480 680L400 720L320 680Z" fill="#1D342F" stroke="#DAE995" stroke-width="2"/>
  <text x="400" y="685" text-anchor="middle" fill="#DAE995" font-family="sans-serif" font-size="12" font-weight="bold">&lt; 3 PROMPTS?</text>

  <!-- Yes Path Usage -->
  <path d="M480 680H640V640H550" stroke="#DAE995" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="670" fill="#DAE995" font-family="sans-serif" font-size="12" font-weight="bold">YES</text>

  <!-- No Path Conversion -->
  <path d="M400 720V760" stroke="#DAE995" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="740" fill="#DAE995" font-family="sans-serif" font-size="12" font-weight="bold">NO</text>

  <!-- Step 6: Conversion -->
  <rect x="200" y="760" width="400" height="100" rx="20" fill="#DAE995"/>
  <rect x="210" y="770" width="380" height="80" rx="15" fill="#1D342F"/>
  <text x="400" y="795" text-anchor="middle" fill="#DAE995" font-family="sans-serif" font-size="18" font-weight="900" font-style="italic">YOU'RE DOING GREAT!</text>
  <text x="400" y="820" text-anchor="middle" fill="#DAE995" font-family="sans-serif" font-size="12">SIGNUP BRIDGE TRIGGERED</text>

  <!-- Final Link -->
  <path d="M400 860V900" stroke="#DAE995" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="250" y="900" width="300" height="50" rx="25" fill="#DAE995"/>
  <text x="400" y="930" text-anchor="middle" fill="#1D342F" font-family="sans-serif" font-size="14" font-weight="800">START FREE TRIAL</text>

  <!-- Arrow Definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DAE995" />
    </marker>
  </defs>
</svg>
