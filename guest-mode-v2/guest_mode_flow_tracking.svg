<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Definitions for Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
  </defs>

  <!-- Client Side Section -->
  <rect x="20" y="20" width="370" height="560" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="40" y="50" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#374151">CLIENT SIDE (PBX Extension)</text>

  <!-- Server Side Section -->
  <rect x="410" y="20" width="370" height="560" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="430" y="50" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6">SERVER SIDE (Gravitee / API)</text>

  <!-- Nodes -->
  <!-- Start -->
  <rect x="130" y="80" width="150" height="40" rx="20" fill="#E5E7EB" stroke="#9CA3AF"/>
  <text x="205" y="105" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Launch Extension</text>
  
  <!-- Decision: Has installId? -->
  <path d="M205 150 L255 180 L205 210 L155 180 Z" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="205" y="184" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#1E40AF">Has installId?</text>

  <!-- Process: Generate ID -->
  <rect x="40" y="160" width="100" height="40" rx="4" fill="white" stroke="#3B82F6"/>
  <text x="90" y="184" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#1E40AF">Generate UUID</text>

  <!-- Process: Request Token -->
  <rect x="130" y="240" width="150" height="40" rx="4" fill="white" stroke="#3B82F6"/>
  <text x="205" y="265" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#1E40AF">GET /issue-token</text>

  <!-- Decision: IP Quota? -->
  <path d="M595 240 L645 270 L595 300 L545 270 Z" fill="#EDE9FE" stroke="#8B5CF6"/>
  <text x="595" y="274" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#5B21B6">IP Quota OK?</text>

  <!-- Blocked -->
  <rect x="680" y="250" width="80" height="40" rx="4" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="720" y="275" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#991B1B">Limit Reached</text>

  <!-- Success: Issue JWT -->
  <rect x="520" y="340" width="150" height="40" rx="4" fill="#ECFDF5" stroke="#10B981"/>
  <text x="595" y="365" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#065F46">Issue JWT (sub=ID)</text>

  <!-- Action: Submit Prompt -->
  <rect x="130" y="340" width="150" height="40" rx="4" fill="white" stroke="#3B82F6"/>
  <text x="205" y="365" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#1E40AF">POST /generate</text>

  <!-- Decision: Sub Quota? -->
  <path d="M595 420 L645 450 L595 480 L545 450 Z" fill="#EDE9FE" stroke="#8B5CF6"/>
  <text x="595" y="454" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#5B21B6">Quota &lt; 3?</text>

  <!-- Final: Success -->
  <rect x="520" y="520" width="150" height="40" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <text x="595" y="545" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#065F46" font-weight="bold">Generate Variation</text>

  <!-- Register Bridge -->
  <rect x="680" y="430" width="80" height="40" rx="4" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="720" y="455" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#92400E">Register Nudge</text>

  <!-- Connectors -->
  <line x1="205" y1="120" x2="205" y2="145" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="155" y1="180" x2="145" y2="180" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="205" y1="210" x2="205" y2="235" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="260" x2="540" y2="260" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="595" y1="300" x2="595" y2="335" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="645" y1="270" x2="675" y2="270" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="360" x2="285" y2="360" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="205" y1="380" x2="205" y2="440" stroke="#6B7280"/>
  <line x1="205" y1="440" x2="540" y2="445" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="595" y1="480" x2="595" y2="515" stroke="#6B7280" marker-end="url(#arrowhead)"/>
  <line x1="645" y1="450" x2="675" y2="450" stroke="#6B7280" marker-end="url(#arrowhead)"/>

</svg>
