<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting Screen - Master Prompt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .pbx-sidebar {
            width: 640px;
            background: white;
            border-left: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.05);
            z-index: 50;
        }

        .pbx-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            background: #3838E7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pbx-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FAFAFA;
        }

        .start-panel {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .option-btn {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
        }

        .option-btn:hover {
            background: #f9fafb;
            border-color: #3838E7;
        }

        .main-content {
            flex-grow: 1;
            opacity: 0.1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .version-dropdown select {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 4px 28px 4px 10px;
            font-size: 12px;
            cursor: pointer;
            appearance: none;
            outline: none;
        }

        .version-dropdown-container {
            position: relative;
        }

        .version-dropdown-container::after {
            content: '▾';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            pointer-events: none;
            font-size: 10px;
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="h-10 bg-blue-900 mb-8 rounded"></div>
        <div class="h-64 bg-white shadow rounded p-8"></div>
    </div>

    <aside class="pbx-sidebar">
        <header class="pbx-header">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded bg-white/20 flex items-center justify-center font-bold text-xs text-white">P
                </div>
                <div>
                    <div class="text-sm font-semibold text-white">My 2nd PBX</div>
                    <div class="text-[11px] text-white/70">Starting Screen Mock</div>
                </div>
            </div>
        </header>

        <div class="pbx-content">
            <div class="start-panel"
                style="background: transparent; box-shadow: none; padding: 0; max-width: 600px; width: 100%;">
                <div class="w-10 h-10 bg-[#D4E788] rounded-lg flex items-center justify-center mx-auto mb-4">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 3H3V10H10V3Z" fill="#1E293B" />
                        <path d="M21 3H14V10H21V3Z" fill="#1E293B" />
                        <path d="M10 14H3V21H10V14Z" fill="#1E293B" />
                        <path d="M21 14H14V21H21V14Z" fill="#1E293B" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold mb-6 text-gray-900">What are we optimizing?</h2>

                <!-- Master Prompt Badge -->
                <div class="w-full text-left">
                    <div id="master-prompt-badge"
                        class="inline-flex items-center gap-1.5 bg-[#EEF2FF] border border-[#C7D2FE] rounded-full px-3 py-1 cursor-pointer group relative select-none mb-4 transition-all hover:bg-[#E0E7FF]"
                        onclick="window.location.href='v4/index.html'">
                        <span class="text-sm">🧠</span>
                        <span class="text-xs font-semibold text-[#3838E7]">Master Prompt</span>
                        <!-- Hover X Button -->
                        <div onclick="event.stopPropagation(); removeMasterPrompt()"
                            class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-white border border-gray-200 shadow-sm rounded-full hidden group-hover:flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors z-10">
                            <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 6L6 18M6 6l12 12"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div
                    class="relative bg-white rounded-xl border border-gray-200 shadow-sm transition-all focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-500">
                    <textarea
                        class="w-full p-4 min-h-[140px] resize-none outline-none text-sm text-gray-700 bg-transparent rounded-xl"
                        placeholder="Ask me anything about starting your optimization journey..."></textarea>

                    <div class="flex justify-between items-center px-3 pb-3">
                        <div class="flex gap-2">
                            <button
                                class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-500 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                </svg>
                            </button>
                            <button
                                class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Figma-logo.svg"
                                    alt="Figma" class="w-4 h-4">
                            </button>
                        </div>
                        <button
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-400 hover:bg-[#3838E7] hover:text-white transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5 10l7-7m0 0l7 7m-7-7v18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="mt-8 text-xs text-gray-400">
                    Our AI can do almost anything, except back-end changes. <span
                        class="underline cursor-pointer hover:text-gray-600">See our guidelines</span>.
                </div>
            </div>
        </div>
    </aside>

    <script>
        // Dummy Prompt Injection (New Brand Tone Version)
        const LONG_PROMPT = `Always write new copy using our brand tone: friendly, professional, and clear. The language should feel approachable without being casual, and confident without sounding promotional. Avoid jargon where possible, and prefer simple, direct phrasing that communicates value quickly. The goal of the copy is to guide users smoothly through the experience, not to persuade aggressively or overwhelm with detail.

All copy changes must be compatible with responsive layouts. Text should be concise enough to adapt well across breakpoints, including smaller screens. Avoid overly long sentences, nested clauses, or formatting that depends on fixed widths. Assume that copy may wrap, truncate, or reflow, and ensure that meaning is preserved even when space is constrained. Headlines and labels should remain understandable when shortened or displayed on a single line.

Use active voice and present tense wherever possible. Prioritize clarity over cleverness. Each sentence should have a clear purpose, whether it is explaining a state, setting an expectation, or prompting an action. When describing system behavior or waiting states, be reassuring and transparent about what is happening, without implying unnecessary urgency.

CTAs should be descriptive and action-oriented, clearly indicating what will happen next. Avoid vague labels such as “Learn more” or “Click here” unless context already makes the action obvious. Error states, empty states, and loading messages should be calm and helpful, focusing on what the user can expect or do next rather than what went wrong.

Assume the copy will live inside a product interface and will be read quickly. Avoid humor, emojis, or personality flourishes that could distract from usability. The overall tone should feel consistent across the product, so that each new piece of copy feels like it belongs to the same system and supports a coherent, professional user experience.`;

        if (!localStorage.getItem('kameleoon_master_prompt')) {
            localStorage.setItem('kameleoon_master_prompt', LONG_PROMPT);
        }

        function removeMasterPrompt() {
            if (confirm('Remove Master Prompt?')) {
                localStorage.removeItem('kameleoon_master_prompt');
                document.getElementById('master-prompt-badge').style.display = 'none';
            }
        }

        // Always show for demo
        document.getElementById('master-prompt-badge').style.display = 'inline-flex';
    </script>
</body>

</html>
