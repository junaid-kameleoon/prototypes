<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kameleoon Mock Code Env</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3838E7',
            'primary-hover': '#2b2bb5',
            background: '#FAFAFA',
            surface: '#FFFFFF',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Monaco', 'Consolas', 'monospace'],
          },
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Mock Data Import (Inlined for simplicity in this HTML file, or assume it's loaded) -->
  <script>
    // Inlining mock data to ensure it works without external file fetch issues on file:// protocol
    const MVP_MOCK_DATA = [
      { name: "list_feature_flags", confidence: "MVP", description: "List all available feature flags.", code: "list_feature_flags" },
      { name: "get_feature_flag", confidence: "MVP", description: "Retrieve specific flag config.", code: "get_feature_flag" },
      { name: "search_flags", confidence: "MVP", description: "Search flags using fuzzy match.", code: "search_flags" },
      { name: "view_activity_logs", confidence: "MVP", description: "View recent changes.", code: "view_activity_logs" },
      { name: "request_results", confidence: "MVP", description: "Get performance metrics.", code: "request_results" }
    ];

    const LOT_1_MOCK_DATA = {
      suggestions: [
        {
          name: "create_feature_flag",
          confidence: "Productivity",
          description: "Create a new feature flag from current context.",
          code: "create_feature_flag"
        },
        {
          name: "wrap_code_in_flag",
          confidence: "Refactoring",
          description: "Wrap selected code in a feature flag.",
          code: "wrap_code_in_flag"
        },
        {
          name: "get_variant_code",
          confidence: "Assets",
          description: "Retrieve CSS/JS for a specific variant.",
          code: "get_variant_code"
        },
        {
          name: "generate_production_code",
          confidence: "Production",
          description: "Convert experiment to React/TS component.",
          code: "generate_production_code"
        },
        {
          name: "update_rollout",
          confidence: "Ops",
          description: "Update traffic allocation for a flag.",
          code: "update_rollout"
        },
        {
          name: "check_script_usage",
          confidence: "Performance",
          description: "Analyze script size and unused flags.",
          code: "check_script_usage"
        },
        {
          name: "scan_for_cleanup",
          confidence: "Governance",
          description: "Find dead code references to stale flags.",
          code: "scan_for_cleanup"
        }
      ],
      responses: {
        create_feature_flag: {
          success: true,
          data: {
            key: "new_checkout_v2",
            name: "New Checkout Flow V2",
            description: "Redesigned checkout with 1-click purchase option",
            tags: ["checkout", "payment", "q4-initiative"],
            status: "active",
            environment: "production",
            variations: [
              { id: 1, name: "Control", traffic: 50 },
              { id: 2, name: "One-Click V1", traffic: 25 },
              { id: 3, name: "One-Click V2", traffic: 25 }
            ]
          },
          message: "✅ Feature Flag 'new_checkout_v2' created successfully."
        },
        wrap_code_in_flag: {
          snippet: `// Wrapped in Feature Flag: new_checkout_v2
// ----------------------------------------
if (kameleoon.isFeatureActive("new_checkout_v2")) {
    console.log("Rendering New Checkout V2");
    
    // Feature: One-Click Checkout
    return (
        <div className="checkout-v2-container">
            <OneClickButton productId={properties.productId} />
            <OrderSummary compact={true} />
        </div>
    );
} else {
    console.log("Rendering Legacy Checkout");
    
    // Fallback: Standard Multi-step
    return (
        <div className="checkout-legacy">
            <StandardForm />
            <button onClick={submitOrder}>Complete Purchase</button>
        </div>
    );
}`
        },
        get_variant_code: {
          css: `/* Variant 2: Sticky Header Blue */
.header-promo-banner {
    position: sticky;
    top: 0;
    background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%);
    color: white;
    z-index: 1000;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.promo-text {
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}`,
          js: `// Variant 2 Logic
document.addEventListener("DOMContentLoaded", () => {
    const banner = document.querySelector(".header-promo-banner");
    if (!banner) return;
    
    // Animate on scroll
    window.addEventListener("scroll", () => {
        if (window.scrollY > 100) {
            banner.classList.add("compact");
        } else {
            banner.classList.remove("compact");
        }
    });

    // Track views
    kameleoon.trackConversion("promo_banner_view", 1);
});`
        },
        generate_production_code: {
          snippet: `/**
 * Generated Component: CheckoutButton
 * Source: Experiment 'checkout_redesign' (Var B)
 */
import React from 'react';
import { useFeatureFlag } from '@kameleoon/react-sdk';
import { trackEvent } from '../utils/analytics';

interface CheckoutButtonProps {
    amount: number;
    currency: string;
}

export const CheckoutButton: React.FC<CheckoutButtonProps> = ({ amount, currency }) => {
    const { isEnabled, variation } = useFeatureFlag('checkout_redesign');

    const handleClick = () => {
        // Automatically tracks the active variation
        trackEvent('checkout_click', { amount, variation });
    };

    if (isEnabled && variation === 'bold_green') {
        return (
            <button 
                onClick={handleClick}
                className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform transition hover:-translate-y-0.5"
            >
                Pay {currency}{amount} Now
            </button>
        );
    }

    // Default Control
    return (
        <button 
            onClick={handleClick}
            className="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700"
        >
            Proceed to Checkout
        </button>
    );
};`
        },
        update_rollout: {
          success: true,
          flag: "checkout_redesign",
          environment: "production",
          changes: {
            from: "10%",
            to: "50%"
          },
          method: "ramp_up",
          message: "🚀 Rollout for 'checkout_redesign' increased to 50% on Production."
        },
        check_script_usage: {
          report: `Health Check Report: Kameleoon Bundle
------------------------------------
Date: ${new Date().toLocaleDateString()}
Total Bundle Size: 24.5 KB (Gzipped) - ✅ Optimal

Active Experiments (3):
  1. [Live] Checkout Redesign (3.2KB)
  2. [Live] Homepage Hero V2 (1.5KB)
  3. [Live] Pricing Table Sort (0.8KB)

Paused/Archived but Loaded (5) - ⚠️ ACTION NEEDED:
  1. [Paused] Summer Sale Banner (Archived 2 months ago)
  2. [Paused] Black Friday Modal
  3. [Paused] Test Button Color
  ... (2 others)

Optimization Opportunity:
> Archive these 5 flags to remove ~4.2KB of dead code from the bundle.`
        },
        scan_for_cleanup: {
          matches: [
            { file: "src/components/Header.js", line: 45, code: "if (flags.holiday_banner) { ... }", status: "DELETED" },
            { file: "src/utils/pricing.js", line: 12, code: "const useNewAlg = flags.pricing_v2;", status: "ARCHIVED" },
            { file: "src/pages/Home.js", line: 102, code: "<Hero variant={flags.hero_v1} />", status: "ARCHIVED" }
          ],
          message: "⚠️ Found 3 references to dead feature flags in your codebase."
        }
      }
    };

  </script>
  <style>
    body {
      background: #1e1e1e;
      color: #d4d4d4;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }

    .editor-line {
      counter-increment: line;
    }

    .editor-line::before {
      content: counter(line);
      display: inline-block;
      width: 2rem;
      margin-right: 1rem;
      text-align: right;
      color: #858585;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Bridge Client
    const callMcpTool = async (name, args = {}) => {
      // FORCE MOCK MODE: Skip local server connection
      // try {
      //   // Try connecting to local server
      //   const controller = new AbortController();
      //   const timeoutId = setTimeout(() => controller.abort(), 1000); // 1s timeout

      //   const response = await fetch('http://localhost:3001/mcp', {
      //     method: 'POST',
      //     headers: { 'Content-Type': 'application/json' },
      //     body: JSON.stringify({
      //       method: 'tools/call',
      //       params: { name, arguments: args }
      //     }),
      //     signal: controller.signal
      //   });
      //   clearTimeout(timeoutId);

      //   const data = await response.json();
      //   return data.result.content[0].text;
      // } catch (err) {
      //   console.warn('MCP connection failed, using mock fallback:', err);
      // }

      console.log('Mock Mode: Intercepting tool call', name);

      // --- LOT 0 (MVP) FALLBACKS ---
      if (name === 'kameleoon_predictive_templates') {
        const mvpSuggestions = MVP_MOCK_DATA;
        const lot1Suggestions = LOT_1_MOCK_DATA.suggestions;
        return JSON.stringify([...mvpSuggestions, ...lot1Suggestions]);
      }

      if (name === 'kameleoon_generate_sdk_snippet') {
        const key = args.key || 'generic';
        // Lot 0 Snippets
        if (key === 'list_feature_flags') return `// List all feature flags\nconst flags = await kameleoon.getFeatureFlags();\nconsole.table(flags);`;
        if (key === 'get_feature_flag') return `// Get details for a specific flag\nconst flagKey = "cart_abandonment_promo";\nconst config = await kameleoon.getFeatureFlag(flagKey);\nconsole.log("Flag Config:", config);`;
        if (key === 'search_flags') return `// Search for flags\nconst query = "header";\nconst results = await kameleoon.searchFlags(query);\nconsole.log(\`Found \${results.length} flags matching "\${query}"\`);`;
        if (key === 'view_activity_logs') return `// View activity logs\nconst logs = await kameleoon.getFlagActivity("new_checkout_flow");\nconsole.table(logs);`;
        if (key === 'request_results') return `// Request results\nconst results = await kameleoon.getExperimentResults("pricing_page_v2");\nconsole.log(results);`;

        return `// Generic Kameleoon SDK Snippet\nconsole.log("Kameleoon SDK initialized for experiment: ${key}");`;
      }

      // --- LOT 1 (LOT 1) FALLBACKS ---
      if (Object.keys(LOT_1_MOCK_DATA.responses).includes(name)) {
        const mock = LOT_1_MOCK_DATA.responses[name];

        // Format response based on type
        if (mock.snippet) return mock.snippet;

        if (mock.css || mock.js) {
          return `/* CSS */\n${mock.css}\n\n// JavaScript\n${mock.js}`;
        }

        if (mock.report) return mock.report;

        if (mock.matches) {
          return mock.message + "\n" + JSON.stringify(mock.matches, null, 2);
        }

        if (mock.success) {
          return `${mock.message}\n` + JSON.stringify(mock.data || {}, null, 2);
        }
      }

      return `Error: Unknown tool ${name}`;
    };

    function App() {
      const [code, setCode] = useState("// Welcome to the Kameleoon Mock Code Environment\n// Type '//' to see AI suggestions from the MCP Server\n\n");
      const [suggestions, setSuggestions] = useState([]);
      const [loading, setLoading] = useState(false);
      const [logs, setLogs] = useState([]);
      const textareaRef = useRef(null);
      const preRef = useRef(null);

      const addLog = (msg) => setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev]);

      // Simple Highlighting using Prism
      useEffect(() => {
        if (preRef.current) {
          preRef.current.innerHTML = Prism.highlight(code, Prism.languages.javascript, 'javascript');
        }
      }, [code]);

      const handleKeyDown = async (e) => {
        if (e.key === 'Enter' && code.trim().endsWith('//')) {
          e.preventDefault();
          setLoading(true);
          addLog('Asking MCP for suggestions...');
          // Add a small delay to simulate network feeling
          setTimeout(async () => {
            try {
              const response = await callMcpTool('kameleoon_predictive_templates', { vertical: 'e-commerce' });
              const s = JSON.parse(response);
              setSuggestions(s);
              addLog(`Received ${s.length} suggestions`);
            } catch (err) {
              addLog('Failed to get suggestions');
              console.error(err);
            } finally {
              setLoading(false);
            }
          }, 300);
        }
      };

      const executeCommand = async (cmd) => {
        setLoading(true);
        addLog(`Executing: ${cmd.name}`);

        // Determine if we use the generic snippet tool or the specific Lot 1 tool name
        // For Lot 0, we mapped them to generating snippets. For Lot 1, we treat them as direct tool calls.

        let result = "";

        if (cmd.confidence === "MVP") {
          // Use existing snippet generation for MVP ops
          result = await callMcpTool('kameleoon_generate_sdk_snippet', { key: cmd.code });
        } else {
          // Direct tool call for Lot 1
          result = await callMcpTool(cmd.code, {});
        }

        // Append Command Name + Result to Editor
        const commandDisplay = `// > Command: ${cmd.name}`;

        setCode(prev => prev + `\n${commandDisplay}\n` + result + '\n');
        setSuggestions([]);
        setLoading(false);
      };

      return (
        <div className="flex h-screen overflow-hidden text-sm font-mono">
          {/* Sidebar */}
          <div className="w-64 bg-[#252526] border-r border-[#333] flex flex-col">
            <div className="p-4 border-b border-[#333]">
              <div className="flex items-center justify-between">
                <h1 className="font-semibold text-white font-sans">Kameleoon MCP</h1>
                <span className="text-[10px] bg-blue-900 text-blue-200 px-1.5 rounded">v1.5</span>
              </div>
              <div className="text-xs text-orange-400 mt-1 flex items-center gap-1">
                <span className="w-2 h-2 rounded-full bg-orange-400"></span>
                Mock Mode Active
              </div>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {/* Available Tools List */}

              <div>
                <div className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Feature Flags (Lot 0)</div>
                <div className="space-y-1">
                  {MVP_MOCK_DATA.map(t => (
                    <div key={t.name} className="flex items-center gap-2 text-gray-400 hover:text-white hover:bg-[#37373d] p-1 rounded cursor-pointer transition-colors"
                      onClick={() => executeCommand(t)}>
                      <span className="text-blue-400 text-xs">ƒ</span>
                      <span className="truncate" title={t.name}>{t.name}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <div className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Production (Lot 1)</div>
                <div className="space-y-1">
                  {LOT_1_MOCK_DATA.suggestions.map(t => (
                    <div key={t.name} className="flex items-center gap-2 text-gray-400 hover:text-white hover:bg-[#37373d] p-1 rounded cursor-pointer transition-colors"
                      onClick={() => executeCommand(t)}>
                      <span className="text-purple-400 text-xs">⚡</span>
                      <span className="truncate" title={t.name}>{t.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="h-48 border-t border-[#333] bg-[#1e1e1e] p-2 overflow-y-auto text-[10px]">
              {logs.map((l, i) => <div key={i} className="text-gray-500">{l}</div>)}
            </div>
          </div>

          {/* Main Editor */}
          <div className="flex-1 flex flex-col bg-[#1e1e1e] relative min-w-0">
            <div className="flex items-center justify-between px-4 py-2 bg-[#2d2d2d] border-b border-[#333]">
              <div className="flex items-center gap-2">
                <span className="text-white font-sans">index.js</span>
              </div>
              <a href="../index.html" className="text-xs text-primary hover:underline font-sans">Back to Gallery</a>
            </div>

            {/* Scrollable Container */}
            <div className="flex-1 relative overflow-auto">
              <div className="relative min-h-full w-full">
                {/* Highlighting Layer - Relative to push height */}
                <pre ref={preRef} className="relative m-0 p-4 pointer-events-none z-0 overflow-hidden language-javascript"
                  style={{
                    whiteSpace: 'pre-wrap',
                    wordWrap: 'break-word',
                    fontFamily: 'inherit',
                    fontSize: 'inherit',
                    lineHeight: '1.5',
                    minHeight: '100%',
                    color: 'transparent' // Hide base text, tokens will show
                  }}></pre>

                {/* Input Layer - Absolute to match size */}
                <textarea
                  value={code}
                  onChange={e => setCode(e.target.value)}
                  onKeyDown={handleKeyDown}
                  className="absolute inset-0 w-full h-full bg-transparent text-[#d4d4d4] p-4 outline-none resize-none z-10 overflow-hidden"
                  style={{
                    color: 'transparent',
                    caretColor: 'white',
                    fontFamily: 'inherit',
                    fontSize: 'inherit',
                    lineHeight: '1.5',
                    whiteSpace: 'pre-wrap',
                    wordWrap: 'break-word'
                  }}
                  spellCheck="false"
                />
              </div>

              {/* Suggestion Popover */}
              {suggestions.length > 0 && (
                <div className="absolute top-20 left-10 bg-[#252526] border border-[#454545] shadow-2xl rounded-md w-96 overflow-hidden z-20">
                  <div className="px-3 py-2 bg-[#333] text-xs font-semibold text-white flex justify-between items-center font-sans">
                    <span>MCP Suggestions</span>
                    <button onClick={() => setSuggestions([])} className="text-gray-400 hover:text-white">×</button>
                  </div>
                  <div className="py-1 max-h-80 overflow-y-auto">
                    {suggestions.map((s, i) => (
                      <button
                        key={i}
                        onClick={() => executeCommand(s)}
                        className="w-full text-left px-3 py-2 hover:bg-[#094771] text-xs group border-b border-[#333] last:border-0"
                      >
                        <div className="flex justify-between mb-1">
                          <span className="font-medium text-white">{s.name}</span>
                          <span className={`text-[10px] px-1.5 rounded ${s.confidence === 'MVP' ? 'bg-blue-900 text-blue-300' : 'bg-purple-900 text-purple-300'}`}>
                            {s.confidence}
                          </span>
                        </div>
                        <div className="text-gray-400 group-hover:text-gray-200 truncate font-sans">{s.description}</div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
